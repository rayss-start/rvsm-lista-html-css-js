<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formatação</title>
</head>
<body>
    <h1>Exemplo de Formatação de Texto</h1>
    <p>
        Este é um exemplo de texto que utiliza diferentes elementos de formatação. 
        Você pode <b>destacar</b> palavras em negrito, 
        <i>incluir</i> texto em itálico, 
        <u>sublinhar</u> partes do texto e 
        <mark>marcar</mark> informações importantes.
    </p>
</body>
</html>
