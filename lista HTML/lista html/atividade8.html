<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Comentário em HTML</title>
</head>
<body>
    <h1>Bem-vindo ao meu site!</h1>
    
    <!-- Este parágrafo apresenta uma breve descrição do site -->
    <p>Este site é um exemplo de como usar comentários em HTML.</p>
    
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    
    <!-- Abaixo está um botão que, quando clicado, não faz nada por enquanto -->
    <button>Clique aqui</button>
</body>
</html>
