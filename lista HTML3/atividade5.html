<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tabela de Ingredientes</title>
  <style>
    body {
      margin: 0;
      padding: 1.2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background: #fafafa;
      max-width: 350px;
      max-height: 600px;
      overflow-y: auto;
      box-sizing: border-box;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #6b4f01;
      font-weight: 700;
      font-size: 1.8rem;
      text-shadow: 0 1px 2px rgba(184, 134, 11, 0.6);
    }

    table {
      border-collapse: collapse;
      margin: 0 auto;
      width: 100%;
      max-width: 320px;
    }

    th,
    td {
      border: 1px solid gray;
      padding: 0.6rem 0.8rem;
      text-align: left;
      font-size: 1rem;
    }

    thead th {
      background-color: #d3d3d3;
      /* light gray */
      font-weight: 700;
    }

    @media (max-width: 400px) {
      body {
        padding: 0.8rem;
        max-width: 100vw;
        max-height: 100vh;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }

      th,
      td {
        font-size: 0.9rem;
        padding: 0.5rem 0.6rem;
      }
    }
  </style>
</head>

<body>
  <h1>Tabela de Ingredientes</h1>
  <table>
    <thead>
      <tr>
        <th>Ingrediente</th>
        <th>Quantidade</th>
        <th>Unidade de Medida</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Farinha de Trigo</td>
        <td>500</td>
        <td>g</td>
      </tr>
      <tr>
        <td>Açúcar</td>
        <td>200</td>
        <td>g</td>
      </tr>
      <tr>
        <td>Leite</td>
        <td>1</td>
        <td>litro</td>
      </tr>
      <tr>
        <td>Manteiga</td>
        <td>150</td>
        <td>g</td>
      </tr>
    </tbody>
  </table>
</body>

</html>
