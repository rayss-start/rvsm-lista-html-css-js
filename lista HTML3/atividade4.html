<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Menu de Navegação</title>
  <style>
    body {
      max-width: 350px;
      max-height: 600px;
      margin: 0;
      padding: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, #fffaf0, #fff5e6);
      color: #333;
      overflow-y: auto;
      box-sizing: border-box;
    }

    h3 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 700;
      color: #6b4f01;
      font-size: 1.6rem;
      text-shadow: 0 1px 2px rgba(184, 134, 11, 0.6);
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0 auto;
      max-width: 220px;
    }

    nav ul li {
      margin-bottom: 1.2rem;
    }

    nav ul li a {
      text-decoration: none;
      color: #b8860b;
      font-size: 1.2rem;
      font-weight: 600;
      display: block;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      transition: color 0.3s ease;
    }

    nav ul li a:hover,
    nav ul li a:focus {
      color: green;
      outline: none;
    }

    @media (max-width: 400px) {
      body {
        padding: 0.8rem;
        max-width: 100vw;
        max-height: 100vh;
      }

      h3 {
        font-size: 1.4rem;
        margin-bottom: 1rem;
      }

      nav ul li a {
        font-size: 1rem;
        padding: 0.5rem 0.8rem;
      }
    }
  </style>
</head>

<body>
  <h3>Navegue pelo conteúdo</h3>
  <nav>
    <ul>
      <li><a href="#">Início</a></li>
      <li><a href="#">Receitas</a></li>
      <li><a href="#">Dicas de Cozinha</a></li>
      <li><a href="#">Contato</a></li>
    </ul>
  </nav>
</body>

</html>
